<!DOCTYPE html>
<html>
<head>
    <title>Student Records</title>

    <style>
        body {
            margin: 0;
            background-color: #f5f7fa;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 145px;
        }

        .box {
            background-color: white;
            width: 510px;
            padding: 30px;
            border-radius: 6px;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 20px;
            color: #1f2937;
        }

        p {
            margin: 7px 0;
            font-size: 14px;
            color: #374151;
        }

        h2 {
            margin: 20px 0 8px;
            font-size: 15px;
            color: #315d7d;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Student Records</h1>

        <p>John's Register Number is UR13CS129</p>
        <p>Joseph's Register Number is UR13CS142</p>
        <p>Meera's Register Number is UR13CS156</p>

        <h2>Born before 2000</h2>

        <p>John</p>
        <p>Joseph</p>

        <h2>Born in 2000 or after</h2>

        <p>Meera</p>

    </div>

</body>
</html>
