<!DOCTYPE html>
<html>
<head>
<title>Product Card jQuery Effects</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<style>
  body { font-family: Arial; text-align: center; background: #f3f0ff; }
  #product {
    width: 250px;
    padding: 15px;
    margin: 20px auto;
    background: #e1f5fe;
    border: 2px solid #0288d1;
    border-radius: 8px;
  }
  button { padding: 6px 12px; margin: 4px; background: #7c4dff; color: white; border: none; border-radius: 4px; }
  #message { color: #00897b; font-weight: bold; margin-top: 15px; }
</style>
</head>
<body>

<h2>Product Card</h2>

<!-- The product card -->
<div id="product">
  <h3>Laptop Pro</h3>
  <p>Price: &#8377;65,000</p>
  <p>Category: Electronics</p>
  <p>Stock Status: Available</p>
  <p>Description: A powerful laptop for everyday use.</p>
</div>

<button id="btnShow">Show</button>
<button id="btnHide">Hide</button>
<button id="btnFade">Fade</button>
<button id="btnSlide">Slide</button>
<button id="btnAnimate">Animate</button>
<button id="btnStop">Stop Animation</button>
<button id="btnCallback">Callback</button>
<button id="btnChain">Chaining</button>

<p id="message"></p>

<script>
$(document).ready(function(){

  // Show the product card
  $("#btnShow").click(function(){
    $("#product").show();
  });

  // Hide the product card
  $("#btnHide").click(function(){
    $("#product").hide();
  });

  // Fade in/out toggle
  $("#btnFade").click(function(){
    $("#product").fadeToggle(1000);
  });

  // Slide up/down toggle
  $("#btnSlide").click(function(){
    $("#product").slideToggle(1000);
  });

  // Animate: move and resize the card
  $("#btnAnimate").click(function(){
    $("#product").animate({
      width: "350px",
      opacity: 0.7,
      marginLeft: "100px"
    }, 2000);
  });

  // Stop the animation while running
  $("#btnStop").click(function(){
    $("#product").stop();
  });

  // Callback: message shows only after effect finishes
  $("#btnCallback").click(function(){
    $("#message").text(""); // clear old message first
    $("#product").fadeOut(1000, function(){
      $("#product").fadeIn(1000, function(){
        $("#message").text("Animation completed successfully");
      });
    });
  });

  // Chaining: multiple effects run one after another
  $("#btnChain").click(function(){
    $("#product")
      .slideUp(500)
      .slideDown(500)
      .fadeOut(500)
      .fadeIn(500);
  });

});
</script>

</body>
</html>
