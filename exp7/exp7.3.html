<!DOCTYPE html>
<html>
<head>
<title>Car Workshop</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<style>
  body { font-family: Arial; text-align: center; background: #f0f4ff; }
  h2 { color: #3949ab; }
  #carBody { width: 200px; height: 60px; background: #e53935; margin: 60px auto 0 auto; border-radius: 20px; position: relative; }
  .glass { width: 60px; height: 25px; background: #ffee58; position: absolute; top: -20px; left: 60px; border-radius: 10px; }
  .wheel { width: 40px; height: 40px; background: #212121; border-radius: 50%; position: absolute; bottom: -20px; }
  #wheelLeft { left: 20px; }
  #wheelRight { right: 20px; }
  button { padding: 6px 12px; margin: 5px; background: #3949ab; color: white; border: none; border-radius: 4px; }
</style>
</head>
<body>

<h2>3. Car Workshop</h2>

<div id="carBody">
  <div class="glass" id="glass"></div>
  <div class="wheel" id="wheelLeft"></div>
  <div class="wheel" id="wheelRight"></div>
</div>

<br><br><br>

<button id="btnGlassColor">Change Glass Color</button>
<button id="btnBodyColor">Change Body Color</button>
<button id="btnTyreIncrease">Tyre Size Increase</button>
<button id="btnTyreDecrease">Tyre Size Decrease</button>
<button id="btnReset">Reset</button>

<script>
$(document).ready(function(){

  // list of colors to cycle through
  var glassColors = ["#ffee58", "#212121", "#80deea", "#ffffff"];
  var bodyColors = ["#e53935", "#43a047", "#3949ab", "#fb8c00"];
  var glassIndex = 0;
  var bodyIndex = 0;

  $("#btnGlassColor").click(function(){
    glassIndex = (glassIndex + 1) % glassColors.length;
    $("#glass").css("background-color", glassColors[glassIndex]);
  });
  
  $("#btnBodyColor").click(function(){
    bodyIndex = (bodyIndex + 1) % bodyColors.length;
    $("#carBody").css("background-color", bodyColors[bodyIndex]);
  });

  $("#btnTyreIncrease").click(function(){
    $(".wheel").each(function(){
      var currentWidth = $(this).width();
      $(this).width(currentWidth + 5);
      $(this).height(currentWidth + 5);
    });
  });

  $("#btnTyreDecrease").click(function(){
    $(".wheel").each(function(){
      var currentWidth = $(this).width();
      if (currentWidth > 10) {
        $(this).width(currentWidth - 5);
        $(this).height(currentWidth - 5);
      }
    });
  });
  
  $("#btnReset").click(function(){
    $("#carBody").css("background-color", "#e53935");
    $("#glass").css("background-color", "#ffee58");
    $(".wheel").width(40).height(40);
    glassIndex = 0;
    bodyIndex = 0;
  });

});
</script>

</body>
</html>
