<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shortest and Longest Word</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            color: #202b38;
        }

        .container {
            width: 465px;
            margin: 115px auto;
            background-color: white;
            padding: 28px;
            border-radius: 7px;
            border: 1px solid #e3e8ed;
        }

        h2 {
            margin: 0 0 20px 0;
            font-size: 20px;
            color: #172536;
        }

        input {
            width: 100%;
            height: 33px;
            padding: 8px 10px;
            border: 1px solid #e0e5ea;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 12px;
            outline: none;
        }

        input:focus {
            border-color: #39779e;
        }

        button {
            background-color: #39779e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 15px;
        }

        button:hover {
            background-color: #2e668a;
        }

        #result {
            font-size: 13px;
            line-height: 1.9;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Shortest &amp; Longest Word Finder</h2>

        <input
            type="text"
            id="sentence"
            placeholder=""
        >

        <br>

        <button onclick="findWords()">Find Words</button>

        <div id="result"></div>

    </div>


    <script>
        function findWords() {

            // Get input
            let sentence = document.getElementById("sentence").value.trim();

            // Check if input is empty
            if (sentence === "") {
                document.getElementById("result").innerHTML =
                    "Please enter a sentence.";
                return;
            }

            // Split sentence into words
            let words = sentence.split(/\s+/);

            // Remove punctuation
            words = words.map(function(word) {
                return word.replace(/[.,!?;:'"()]/g, "");
            });

            // Find shortest and longest
            let shortest = words[0];
            let longest = words[0];

            for (let i = 1; i < words.length; i++) {

                if (words[i].length < shortest.length) {
                    shortest = words[i];
                }

                if (words[i].length > longest.length) {
                    longest = words[i];
                }
            }

            // Display result
            document.getElementById("result").innerHTML =
                "Shortest: '" + shortest + "'<br>" +
                "Longest: '" + longest + "'";
        }
    </script>

</body>
</html>
